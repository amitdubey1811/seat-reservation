spring.application.name=seat-reservation

# Virtual threads: the request ceiling becomes the connection pool (where we own the
# timeout and can translate it to 429) rather than Tomcat's thread count, where queueing
# would be invisible and unbounded.
spring.threads.virtual.enabled=true

# --- datasource ------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/seats}
# The local `seats` database and every table in it is owned by the `seats` role.
# Connecting as a different role fails with "permission denied for table
# flyway_schema_history" (SQLSTATE 42501): Flyway has to own the objects it migrates.
#
# These stay as ${PLACEHOLDER:default} on purpose. docker-compose and Render both supply
# DATABASE_USER / DATABASE_PASSWORD as environment variables, so hardcoding a value here
# breaks the container and the deploy — and commits a credential to a public repo.
spring.datasource.username=${DATABASE_USER:seats}
spring.datasource.password=${DATABASE_PASSWORD:seats}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:24}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:4}
# A pool timeout must surface as 429, never Spring's default 503 (5xx fails the bar).
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:2000}
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.max-lifetime=600000
# Must stay below max-lifetime, or Hikari disables idle reaping and warns at startup.
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.pool-name=seats-pool

# --- auth ------------------------------------------------------------------------------
# Infrastructure, not policy: rotating the signing secret invalidates every token in
# flight, which is a restart-shaped event. Startup fails if the secret is under 32 bytes.
seats.auth.jwt-secret=${JWT_SECRET:local-development-signing-secret-not-for-production}
seats.auth.token-ttl=${JWT_TTL:PT12H}
seats.auth.admin-secret=${ADMIN_SECRET:local-admin-secret}

# --- jpa / hibernate -------------------------------------------------------------------
# Flyway owns the schema. `validate` makes Hibernate check that the entities agree with
# it at startup and refuse to boot if they have drifted apart, which is a free
# correctness check. Never `update` or `create` — that would have Hibernate fighting
# Flyway over the same tables.
spring.jpa.hibernate.ddl-auto=validate

# The default (true) keeps a database connection open for the whole request, including
# response rendering. Under a burst that exhausts the pool on its own and manufactures
# exactly the saturation we are engineering against. This is the single most important
# JPA setting in this service.
spring.jpa.open-in-view=false

# Creating a show inserts every seat at once; a 20,000-seat hall must not be 20,000
# round trips.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# --- migrations ------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Free-tier Postgres (Neon) autosuspends; survive a cold start instead of dying on the
# first refused connection.
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=2s

# --- json ------------------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
# The spec's payloads are snake_case (reservation_id, amount_paise, price_paise), so Java
# records stay camelCase and Jackson does the translation in one place.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

# --- server ----------------------------------------------------------------------------
server.port=${PORT:8080}
server.shutdown=graceful
server.tomcat.max-connections=${SERVER_MAX_CONNECTIONS:10000}
server.tomcat.accept-count=${SERVER_ACCEPT_COUNT:2000}

# --- actuator --------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# Liveness must NOT check the DB: a dead dependency should fail readiness (stop routing
# traffic), not liveness (restart the process in a loop).
management.endpoint.health.group.liveness.include=ping
management.endpoint.health.group.readiness.include=db
management.metrics.tags.application=seat-reservation

# --- logging ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.amitdubey.seats=INFO
