spring:
  application:
    name: seat-reservation

  # Virtual threads: the request ceiling becomes the connection pool (where we own the
  # timeout and can translate it to 429) rather than Tomcat's thread count, where
  # queueing would be invisible and unbounded.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seats}
    username: ${DATABASE_USER:seats}
    password: ${DATABASE_PASSWORD:seats}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:24}
      minimum-idle: ${DB_POOL_MIN_IDLE:4}
      # A pool timeout must surface as 429, never Spring's default 503 (5xx fails the bar).
      connection-timeout: ${DB_POOL_TIMEOUT_MS:2000}
      validation-timeout: 1000
      max-lifetime: 600000
      keepalive-time: 120000
      pool-name: seats-pool

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Free-tier Postgres (Neon) autosuspends; survive a cold start instead of
    # dying on the first refused connection.
    connect-retries: 10
    connect-retries-interval: 2s

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    max-connections: ${SERVER_MAX_CONNECTIONS:10000}
    accept-count: ${SERVER_ACCEPT_COUNT:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        # Liveness must NOT check the DB: a dead dependency should fail readiness
        # (stop routing traffic), not liveness (restart the process in a loop).
        liveness:
          include: ping
        readiness:
          include: db
  metrics:
    tags:
      application: seat-reservation

logging:
  level:
    root: INFO
    com.amitdubey.seats: INFO
