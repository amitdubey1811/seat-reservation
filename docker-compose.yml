services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seats
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats -d seats"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/seats
      DATABASE_USER: seats
      DATABASE_PASSWORD: seats
      JWT_SECRET: local-development-signing-secret-not-for-production
      ADMIN_SECRET: local-admin-secret
      DB_POOL_SIZE: "24"
    ports:
      - "8080:8080"

volumes:
  db-data:
